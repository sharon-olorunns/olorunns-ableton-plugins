name: Build plugins

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # Windows runners would otherwise use PowerShell
    shell: bash

env:
  PLUGINS: -p halo -p glitch -p prism -p rig

jobs:
  test:
    name: Tests and plugin validation (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl-dev libjack-dev libx11-xcb-dev \
            libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      # Installs the toolchain pinned in rust-toolchain.toml
      - name: Set up Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --release

      - name: Build plugins
        run: cargo xtask bundle $PLUGINS --release

      - name: Validate VST3 plugins with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q pluginval.zip
          for plugin in target/bundled/*.vst3; do
            echo "::group::$plugin"
            ./pluginval --strictness-level 10 --skip-gui-tests --validate-in-process --validate "$plugin"
            echo "::endgroup::"
          done

  package-macos:
    name: Package for macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal plugins
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: cargo xtask bundle-universal $PLUGINS --release

      - name: Sign (ad-hoc)
        # Not notarized, but Apple Silicon needs every plugin binary to carry a signature
        run: |
          for bundle in target/bundled/*.vst3; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
            lipo -info "$bundle/Contents/MacOS/"*
          done

      - name: Assemble zip
        run: |
          dir=Olorunns-Plugins-macOS
          mkdir -p "$dir"
          cp -R target/bundled/*.vst3 "$dir/"
          cp scripts/install-mac.sh "$dir/install.sh"
          chmod +x "$dir/install.sh"
          cp scripts/README-macOS.txt "$dir/README.txt"
          # ditto keeps the bundles' structure and permissions intact
          ditto -c -k --sequesterRsrc --keepParent "$dir" "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Olorunns-Plugins-macOS
          path: Olorunns-Plugins-macOS.zip
          if-no-files-found: error

  release:
    name: Publish download
    needs: [test, package-macos]
    # Keep a "latest" download up to date from the default branch, and make a proper release
    # for version tags like v1.0.0
    if: >-
      github.event_name == 'push' && (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Olorunns-Plugins-macOS

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" Olorunns-Plugins-macOS.zip --verify-tag \
              --title "Olorunns Plugins $tag" --generate-notes
          else
            git tag --force latest "$GITHUB_SHA"
            git push --force origin refs/tags/latest
            notes="Automatic build of $(git log -1 --format=%h) on ${GITHUB_REF_NAME}. Download Olorunns-Plugins-macOS.zip below."
            if gh release view latest > /dev/null 2>&1; then
              gh release edit latest --title "Latest build" --notes "$notes" --prerelease
              gh release upload latest Olorunns-Plugins-macOS.zip --clobber
            else
              gh release create latest Olorunns-Plugins-macOS.zip --verify-tag \
                --title "Latest build" --notes "$notes" --prerelease
            fi
          fi
