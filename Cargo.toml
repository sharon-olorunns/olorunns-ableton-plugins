[workspace]
resolver = "2"
members = [
  "xtask",
  "crates/olo_dsp",
  "crates/olo_ui",
  "plugins/halo",
  "plugins/glitch",
  "plugins/prism",
  "plugins/rig",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sharon Olorunniwo"]
# The VST3 bindings used by nih-plug are GPLv3, so the built plugins are too.
license = "GPL-3.0-or-later"
repository = "https://github.com/sharon-olorunns/olorunns-ableton-plugins"

[workspace.dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
olo_dsp = { path = "crates/olo_dsp" }
olo_ui = { path = "crates/olo_ui" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
